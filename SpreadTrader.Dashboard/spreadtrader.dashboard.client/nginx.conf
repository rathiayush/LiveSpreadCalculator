server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST endpoints - forwarded to the Api container (see docker-compose.yml, service "api").
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub - needs the WebSocket upgrade headers in addition to the above.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s; # keep long-lived SignalR connections open
    }

    # Static SPA - fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
