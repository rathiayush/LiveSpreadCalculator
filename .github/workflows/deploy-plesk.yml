# Deploy any instance (Production / pradeep-1 / pradeep-2) to the Plesk (Windows/IIS) host over FTP.
#
# The Plesk counterpart of the master_*-livespreadcalculator.yml workflows, which deploy the same
# three instances to Azure. One workflow serves all three here (rather than three near-identical
# files) because the only thing that varies is the environment name and the FTP docroot - both
# chosen from the dropdown when you run it.
#
# Mirrors deploy-plesk.ps1 / deploy-pradeep-1-plesk.ps1 / deploy-pradeep-2-plesk.ps1 exactly. See
# deploy-pradeep-1-plesk.ps1's header for WHY the Plesk mechanics differ from Azure's:
#   - app_offline.htm is uploaded FIRST so IIS releases its lock on the running app's DLLs, and
#     deleted last to bring it back up. Without it, uploading over a live app fails partway with
#     locked-file errors, leaving a half-deployed app.
#   - ASPNETCORE_ENVIRONMENT is injected into web.config (no Azure App Settings equivalent here).
#
# CREDENTIALS are inline under `env:` below by request, matching the .ps1 deploy scripts, so this
# runs with no repo-secret setup. Two consequences worth knowing:
#   - Anyone with read access to this repo has the FTP password. If the repo is ever made public,
#     or shared, rotate it in Plesk.
#   - GitHub only masks values registered as SECRETS. Because these are plain literals, if a step
#     ever echoes one it appears in the run log in clear text. Nothing here echoes them, but keep
#     that in mind before adding debug output to the FTP step.
# To switch to secrets later: replace the three literals with ${{ secrets.PLESK_FTP_* }} and add
# them under Settings > Secrets and variables > Actions. Nothing else changes.
#
# ALSO SET the docroot for each instance under `env:` below - the placeholders will not work.
# Two instances must never share a docroot: they would overwrite each other's binaries and fight
# over the same App_Data CSVs.

name: Deploy to Plesk (FTP)

on:
  # MANUAL ONLY, same policy as the Azure workflows: a merge must never be able to redeploy a live
  # trading app on its own.
  workflow_dispatch:
    inputs:
      instance:
        description: 'Which instance to deploy'
        required: true
        type: choice
        options:
          - pradeep-1
          - pradeep-2
          - Production
      seed_users_csv:
        description: 'Upload App_Data/users*.csv too (FIRST deploy to a fresh host only - otherwise it OVERWRITES live passwords)'
        required: true
        type: boolean
        default: false

env:
  # Credentials are PER INSTANCE, not shared, because the instances live on different Plesk
  # SUBSCRIPTIONS (strange-cray vs musing-booth). Each subscription has its own system user, its own
  # home directory and its own FTP login - one subscription's credentials cannot reach another's
  # files. Note also that each user's /httpdocs is relative to THEIR OWN home, so the same docroot
  # string means a different folder depending on which login is used.
  # All inline by request (see the header note about the trade-off).

  # --- pradeep-1: strange-cray subscription, primary domain ---
  FTP_HOST_PRADEEP_1: 103.191.208.18
  FTP_USER_PRADEEP_1: strange-c_katfn7gx3p
  FTP_PASSWORD_PRADEEP_1: SpreadCal@123
  DOCROOT_PRADEEP_1: /httpdocs

  # --- pradeep-2: strange-cray subscription, additional domain ---
  FTP_HOST_PRADEEP_2: 103.191.208.18
  FTP_USER_PRADEEP_2: strange-c_katfn7gx3p
  FTP_PASSWORD_PRADEEP_2: SpreadCal@123
  DOCROOT_PRADEEP_2: /mahakaltradinggroup.com/httpdocs

  # --- Production: musing-booth subscription, using the SAME login as above per instruction.
  #     If a run fails at login (530) or on the first upload (550), that's the likely cause: Plesk
  #     normally gives each subscription its own system user, so musing-booth may need its own FTP
  #     credentials (its Plesk > Connection Info, or Websites & Domains > FTP Access). Nothing is
  #     written before login succeeds, so this fails safely rather than deploying somewhere wrong.
  FTP_HOST_PRODUCTION: 103.191.208.18
  FTP_USER_PRODUCTION: strange-c_katfn7gx3p
  FTP_PASSWORD_PRODUCTION: SpreadCal@123
  DOCROOT_PRODUCTION: /httpdocs

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve FTP target for '${{ inputs.instance }}'
        id: target
        shell: pwsh
        run: |
          switch ('${{ inputs.instance }}') {
            'pradeep-1'  {
              $ftpHost = '${{ env.FTP_HOST_PRADEEP_1 }}'; $ftpUser = '${{ env.FTP_USER_PRADEEP_1 }}'
              $ftpPass = '${{ env.FTP_PASSWORD_PRADEEP_1 }}'; $docroot = '${{ env.DOCROOT_PRADEEP_1 }}'
            }
            'pradeep-2'  {
              $ftpHost = '${{ env.FTP_HOST_PRADEEP_2 }}'; $ftpUser = '${{ env.FTP_USER_PRADEEP_2 }}'
              $ftpPass = '${{ env.FTP_PASSWORD_PRADEEP_2 }}'; $docroot = '${{ env.DOCROOT_PRADEEP_2 }}'
            }
            'Production' {
              $ftpHost = '${{ env.FTP_HOST_PRODUCTION }}'; $ftpUser = '${{ env.FTP_USER_PRODUCTION }}'
              $ftpPass = '${{ env.FTP_PASSWORD_PRODUCTION }}'; $docroot = '${{ env.DOCROOT_PRODUCTION }}'
            }
          }

          # Fail before touching anything rather than half-deploying to the wrong place.
          if ($ftpUser -like '*CHANGE_ME*' -or $ftpPass -like '*CHANGE_ME*' -or $docroot -like '*CHANGE_ME*') {
            throw "'${{ inputs.instance }}' still has placeholder values - fill in its FTP_*/DOCROOT_* entries under env: in this workflow file."
          }

          # Registers the password as a masked value for the rest of the run, so it can never be
          # echoed into the log even by accident. Plain env: literals are NOT masked automatically -
          # only real repo secrets are - so this does it explicitly.
          Write-Host "::add-mask::$ftpPass"

          "ftp_host=$ftpHost" >> $env:GITHUB_OUTPUT
          "ftp_user=$ftpUser" >> $env:GITHUB_OUTPUT
          "ftp_password=$ftpPass" >> $env:GITHUB_OUTPUT
          "docroot=$docroot" >> $env:GITHUB_OUTPUT
          Write-Host "Deploying '${{ inputs.instance }}' to $ftpHost$docroot as $ftpUser"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Program.cs serves the dashboard as static files from wwwroot - dotnet publish alone never
      # builds it (no MSBuild target wired up for that), so this is an explicit step, same as the
      # Azure workflows and the .ps1 scripts.
      - name: Build dashboard client
        run: |
          npm ci
          npm run build
        working-directory: SpreadTrader.Dashboard/spreadtrader.dashboard.client

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: dotnet publish
        run: dotnet publish LiveSpreadCalculator/LiveSpreadCalculator.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Copy dashboard build into wwwroot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/publish/wwwroot" | Out-Null
          Copy-Item -Path "SpreadTrader.Dashboard/spreadtrader.dashboard.client/dist/*" -Destination "${{ github.workspace }}/publish/wwwroot" -Recurse -Force

      # dotnet publish emits web.config for IIS with an <aspNetCore> element; the environment name
      # goes in as an <environmentVariables> entry so it ships WITH the app rather than depending
      # on a panel setting someone has to remember to set.
      - name: Inject ASPNETCORE_ENVIRONMENT into web.config
        shell: pwsh
        run: |
          $path = "${{ github.workspace }}/publish/web.config"
          if (-not (Test-Path $path)) {
            Write-Warning "No web.config in publish output - skipping. App will run as Production unless set in Plesk."
            exit 0
          }
          [xml]$xml = Get-Content $path
          $aspNetCore = $xml.SelectSingleNode("//aspNetCore")
          if (-not $aspNetCore) { Write-Warning "web.config has no <aspNetCore> element - skipping."; exit 0 }
          $envVars = $aspNetCore.SelectSingleNode("environmentVariables")
          if (-not $envVars) {
            $envVars = $xml.CreateElement("environmentVariables")
            [void]$aspNetCore.AppendChild($envVars)
          }
          $existing = $envVars.SelectSingleNode("environmentVariable[@name='ASPNETCORE_ENVIRONMENT']")
          if ($existing) {
            $existing.SetAttribute("value", '${{ inputs.instance }}')
          } else {
            $node = $xml.CreateElement("environmentVariable")
            $node.SetAttribute("name", "ASPNETCORE_ENVIRONMENT")
            $node.SetAttribute("value", '${{ inputs.instance }}')
            [void]$envVars.AppendChild($node)
          }
          $xml.Save($path)
          Write-Host "web.config: ASPNETCORE_ENVIRONMENT=${{ inputs.instance }}"

      # Passwords are editable on the live server (Profile > Change password writes an encrypted
      # value straight into the server's users csv). Shipping the repo's copy on every deploy would
      # silently reset them - so it's stripped unless you explicitly ask to seed a fresh host.
      - name: Strip users*.csv unless seeding
        if: ${{ !inputs.seed_users_csv }}
        shell: pwsh
        run: |
          Remove-Item "${{ github.workspace }}/publish/App_Data/users*.csv" -Force -ErrorAction SilentlyContinue
          Write-Host "users*.csv stripped - live server credentials will not be overwritten."

      - name: Warn when seeding users*.csv
        if: ${{ inputs.seed_users_csv }}
        run: echo "::warning::seed_users_csv=true - this deploy WILL overwrite the live server's users file and reset any password changed on the server."

      # Single PowerShell step for the whole FTP transaction so app_offline.htm is guaranteed to be
      # cleaned up (or deliberately left behind on failure) by the same script that created it.
      - name: Upload to Plesk over FTP
        shell: pwsh
        env:
          FTP_HOST: ${{ steps.target.outputs.ftp_host }}
          FTP_USER: ${{ steps.target.outputs.ftp_user }}
          FTP_PASSWORD: ${{ steps.target.outputs.ftp_password }}
          REMOTE_ROOT: ${{ steps.target.outputs.docroot }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = "${{ github.workspace }}\publish"
          $remoteRoot = $env:REMOTE_ROOT
          $ftpHost    = $env:FTP_HOST
          $cred       = New-Object System.Net.NetworkCredential($env:FTP_USER, $env:FTP_PASSWORD)

          function Invoke-Ftp {
            param([string]$RemotePath, [string]$Method, [byte[]]$Body)
            $req = [System.Net.FtpWebRequest]::Create("ftp://$ftpHost$RemotePath")
            $req.Credentials = $cred
            $req.Method = $Method
            $req.UsePassive = $true
            $req.UseBinary = $true
            $req.KeepAlive = $false
            if ($Body) {
              $req.ContentLength = $Body.Length
              $s = $req.GetRequestStream(); $s.Write($Body, 0, $Body.Length); $s.Close()
            }
            $resp = $req.GetResponse(); $resp.Close()
          }

          function New-FtpDir {
            param([string]$RemotePath)
            # Almost always "550 already exists" after the first run - swallowed deliberately, since
            # a real problem (bad credentials/host/permission) surfaces on the next file upload.
            try { Invoke-Ftp -RemotePath $RemotePath -Method ([System.Net.WebRequestMethods+Ftp]::MakeDirectory) } catch { }
          }

          function Send-FtpFile {
            param([string]$LocalFile, [string]$RemotePath)
            Invoke-Ftp -RemotePath $RemotePath -Method ([System.Net.WebRequestMethods+Ftp]::UploadFile) -Body ([System.IO.File]::ReadAllBytes($LocalFile))
          }

          # --- take offline so IIS unloads the app and releases its DLL locks ---
          Write-Host "Taking app offline..."
          $offline = "$env:RUNNER_TEMP\app_offline.htm"
          '<!DOCTYPE html><html><head><title>Deploying</title></head><body style="font-family:sans-serif;padding:40px"><h2>Deployment in progress</h2><p>This instance is being updated and will be back shortly.</p></body></html>' | Out-File -FilePath $offline -Encoding utf8
          Send-FtpFile -LocalFile $offline -RemotePath "$remoteRoot/app_offline.htm"
          Start-Sleep -Seconds 3

          # --- directories first (FTP has no mkdir -p), parents before children ---
          New-FtpDir -RemotePath $remoteRoot
          Get-ChildItem -Path $publishDir -Recurse -Directory | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($publishDir.Length) -replace '\\', '/'
            New-FtpDir -RemotePath "$remoteRoot$rel"
          }

          # --- files ---
          $files = Get-ChildItem -Path $publishDir -Recurse -File
          $failed = @()
          $i = 0
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($publishDir.Length) -replace '\\', '/'
            try { Send-FtpFile -LocalFile $f.FullName -RemotePath "$remoteRoot$rel" }
            catch { $failed += "$rel -> $($_.Exception.Message)" }
            $i++
            if ($i % 50 -eq 0) { Write-Host "  ...$i/$($files.Count)" }
          }
          Write-Host "$i file(s) processed, $($failed.Count) failed."

          if ($failed.Count -gt 0) {
            # Deliberately leave app_offline.htm in place: a half-deployed trading app must not
            # start serving. Fix and re-run.
            Write-Host "::error::$($failed.Count) file(s) failed to upload. App left OFFLINE on purpose."
            $failed | Select-Object -First 15 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

          # --- back online ---
          Write-Host "Bringing app back online..."
          try { Invoke-Ftp -RemotePath "$remoteRoot/app_offline.htm" -Method ([System.Net.WebRequestMethods+Ftp]::DeleteFile) }
          catch { Write-Host "::warning::Could not delete app_offline.htm - the site will stay offline until it is removed manually. $($_.Exception.Message)" }

      - name: Post-deploy reminders
        if: success()
        run: |
          echo "::notice::Deployed '${{ inputs.instance }}' to ${{ steps.target.outputs.docroot }}"
          echo "::notice::First deploy only - confirm the ASP.NET Core 8 Hosting Bundle is installed on the server (without it IIS returns 500.19/502.5), register <public-url>/api/auth/callback in the Kite/Dhan console, and point Dashboard__BaseUrl at this host instead of the old Azure URL."
