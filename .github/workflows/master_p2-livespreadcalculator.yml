# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - p2-LiveSpreadCalculator

on:
  # MANUAL ONLY - deploys are started from the Actions tab ("Run workflow"), never automatically on
  # a push or merge to master. Deliberate: a merge should not be able to redeploy a live trading
  # app on its own. Re-add a `push:` trigger here if you ever want that back.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Program.cs serves the dashboard as static files from LiveSpreadCalculator/wwwroot - dotnet
      # publish alone never builds it (there's no MSBuild target wired up for that), so this has
      # to be an explicit step, same as deploy.ps1 does locally.
      - name: Build dashboard client
        run: |
          npm ci
          npm run build
        working-directory: SpreadTrader.Dashboard/spreadtrader.dashboard.client

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Publishes the API project specifically, not the whole solution - the class library
      # projects it references are pulled in automatically as part of that, so nothing else needs
      # naming here.
      - name: dotnet publish
        run: dotnet publish LiveSpreadCalculator/LiveSpreadCalculator.csproj -c Release -o "${{ env.DOTNET_ROOT }}/myapp"

      - name: Copy dashboard build into wwwroot
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.DOTNET_ROOT }}/myapp/wwwroot" | Out-Null
          Copy-Item -Path "SpreadTrader.Dashboard/spreadtrader.dashboard.client/dist/*" -Destination "${{ env.DOTNET_ROOT }}/myapp/wwwroot" -Recurse -Force

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6EF382BE581A424D99593F888B36789A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_688CE7C89FB343128A5BF28EFA63FE37 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_26F81FBFDD2047DDAB2E78105EBD2A3F }}

      # Set explicitly on every deploy rather than relying on it persisting from prior runs -
      # same as deploy-pradeep-2.ps1 does for this Web App.
      - name: Set ASPNETCORE_ENVIRONMENT
        run: az webapp config appsettings set --resource-group live-spread2 --name P2-LiveSpreadCalculator --settings ASPNETCORE_ENVIRONMENT=pradeep-2

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'p2-LiveSpreadCalculator'
          slot-name: 'Production'
          package: .

